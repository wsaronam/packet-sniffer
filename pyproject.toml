[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-sniffer"
version = "1.0.0"
description = "lightweight network packet sniffer built with Scapy"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.7.0",
    "rich>=15.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]